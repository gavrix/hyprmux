    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g stroke="#6a7082" stroke-width="34" fill="#1a1e2c">
    <rect x="547" y="185" width="292" height="292" rx="44"/>
    <rect x="547" y="547" width="292" height="292" rx="44"/>
  </g>
  <rect x="185" y="185" width="292" height="654" rx="48" fill="#1a1e2c" stroke="url(#active)" stroke-width="44"/>
