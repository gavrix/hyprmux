//
// Minimal wire-compatible subset of the Android Emulator's installed
// emulator_controller.proto. Field numbers and service paths must remain exact.
syntax = "proto3";
package android.emulation.control;
import "google/protobuf/empty.proto";

service EmulatorController {
  rpc streamInputEvent(stream InputEvent) returns (google.protobuf.Empty);
  rpc streamScreenshot(ImageFormat) returns (stream Image);
}

message KeyboardEvent {
  enum KeyCodeType { Usb = 0; Evdev = 1; XKB = 2; Win = 3; Mac = 4; }
  enum KeyEventType { keydown = 0; keyup = 1; keypress = 2; }
  KeyCodeType codeType = 1;
  KeyEventType eventType = 2;
  int32 keyCode = 3;
  string key = 4;
  string text = 5;
}

message Touch {
  int32 x = 1;
  int32 y = 2;
  int32 identifier = 3;
  int32 pressure = 4;
  int32 touch_major = 5;
  int32 touch_minor = 6;
  enum EventExpiration { EVENT_EXPIRATION_UNSPECIFIED = 0; NEVER_EXPIRE = 1; }
  EventExpiration expiration = 7;
  int32 orientation = 8;
}
message TouchEvent { repeated Touch touches = 1; int32 display = 2; }

message InputEvent {
  oneof type {
    KeyboardEvent key_event = 1;
    TouchEvent touch_event = 2;
  }
}

// The client owns the handle. A file-backed MMAP handle must use a file:/// URL.
// The emulator can overwrite the mapping while the client reads it, causing tearing.
message ImageTransport {
  enum TransportChannel { TRANSPORT_CHANNEL_UNSPECIFIED = 0; MMAP = 1; }
  TransportChannel channel = 1;
  string handle = 2;
}
message ImageFormat {
  enum ImgFormat { PNG = 0; RGBA8888 = 1; RGB888 = 2; }
  ImgFormat format = 1;
  uint32 width = 3;
  uint32 height = 4;
  uint32 display = 5;
  ImageTransport transport = 6;
}
message Image {
  ImageFormat format = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestampUs = 6;
}
