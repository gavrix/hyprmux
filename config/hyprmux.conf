# hyprmux config. Syntax follows hyprland.conf (hyprlang):
#   key = value, nested sections, $variables, bind = MODS, key, dispatcher, args
# Copy to ~/.config/hyprmux/hyprmux.conf and edit. Saving reloads it live.
#
# SUPER is the Command key. Keys are physical positions (US ANSI names),
# so binds keep working with other keyboard layouts.

$mod = SUPER

general {
    gaps_in = 5
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    # Corner curve: 2 = circular, 4 = squircle (Apple-style), higher = squarer.
    rounding_power = 2.0
    # Window content opacity. E.g. inactive_opacity = 0.7 for see-through unfocused windows.
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.25
    dim_special = 0.3

    # Frosted-glass blur behind translucent windows.
    blur {
        enabled = false
    }

    shadow {
        enabled = true
        range = 12
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = workspaces, 1, 3.5, easeOutQuint, slide
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
    # Hyprmux's own UI. Without a style, notifications slide in from the nearest
    # edge and pickers pop in; set one (slide, popin 90%, fade) to override both.
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint
    animation = layersOut, 1, 1.5, linear
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
}

input {
    # 1 = focus follows mouse, 0 = click to focus
    follow_mouse = 1
}

dwindle {
    preserve_split = true
    # 0 = split toward the mouse, 1 = new window left/top, 2 = right/bottom
    force_split = 2
}

binds {
    workspace_back_and_forth = false
}

misc {
    # fill: full screen on the normal desktop, so a transparent background still
    # shows the wallpaper. native: macOS full screen on its own Space (black behind).
    fullscreen_style = fill
    # Behind the windows. An alpha below 1 makes hyprmux see-through:
    # rgba(00000000) shows the desktop in the gaps. (Native fullscreen puts the
    # window on its own Space, where there is only black behind it.)
    background_color = rgb(11111b)
}

# Settings passed straight to libghostty (same keys as ~/.config/ghostty/config).
# Your normal Ghostty config is loaded first; these override it.
# Note: '#' starts a comment here, so write colors without it (1e1e2e) or as ##1e1e2e.
ghostty {
    window-padding-x = 8
    window-padding-y = 6
}

# Groups: several windows as tabs in one tile (Hyprland-style).
group {
    # New windows opened while a group is focused join it as a tab.
    auto_group = true
    # Border width for groups (default: general:border_size).
    # border_size = 3
    col.border_active = rgba(ffaa33ee) rgba(ff5f5fee) 45deg
    col.border_inactive = rgba(775533aa)
    groupbar {
        enabled = true
        height = 20
        font_size = 11
        col.active = rgba(33ccffee)
        col.inactive = rgba(3a3a4aee)
        text_color = rgba(ffffffee)
    }
}

# Hyprmux's own UI. It takes its font and colors from your Ghostty config and
# its borders, rounding, shadow, and blur from the decoration settings above.
hud {
    # font_family = JetBrains Mono   # default: Ghostty's font-family
    # font_size = 13                 # default: Ghostty's font-size
    notifications {
        # top_right, top_left, bottom_right, bottom_left, top, bottom, center
        position = top_right
        # Milliseconds on screen. 0 = until clicked.
        timeout = 5000
        max_visible = 5
        width = 380
    }
    # Menus and selection lists, centered in the window.
    picker {
        width = 600
        max_rows = 10
    }
}

# Session restore. On launch, Hyprmux brings back the workspaces, their layout,
# terminal directories, web pages, and simulators from when it last quit. The
# shells themselves start fresh. A restored launch skips exec-once and exec.
session {
    restore = true
    # Programs relaunched with the same arguments, in the same directory, when they
    # were running in a terminal's foreground. "*" allows any; deny then excludes some.
    programs = nvim, vim, lazygit, htop, btop, less, man
    # deny = ssh
    # Agents report their session with `hyprmuxctl resume` (see docs/CONFIGURATION.md).
    # These commands bring them back; {id} is the session id.
    resume {
        pi = pi --session {id}
        codex = codex resume {id}
    }
    # Layouts start a new agent session with these.
    start {
        pi = pi
        codex = codex
    }
}

hyprmux {
    # ⌘Q quits only when pressed twice within two seconds.
    confirm_quit = true
}

# Web surfaces.
web {
    # webkit: light, native, but no passkeys (Apple only allows them in approved browsers).
    # chromium: bundled Chromium (CEF). Passkeys from your phone or a security key work,
    # so Okta and GitHub sign-in work. Your Mac's own Touch ID passkeys don't. Needs a restart.
    engine = webkit
    home = https://duckduckgo.com
    # %s is replaced by the search terms typed in the address bar.
    search = https://duckduckgo.com/?q=%s
    # Cmd+click on a link in a terminal opens it in a web tile instead of your browser.
    open_terminal_links = true
    address_bar = true
}

# Programs to run in new terminals at startup.
# exec-once = htop

# --- Binds -----------------------------------------------------------------

bind = $mod, Return, exec,
bind = $mod, T, exec,
bind = $mod, W, killactive
bind = $mod SHIFT, M, exit
bind = $mod SHIFT, R, reload

bind = $mod SHIFT, Space, togglefloating
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod CTRL, F, monitorfullscreen
bind = $mod, E, togglesplit
bind = $mod SHIFT, E, swapsplit
bind = $mod, grave, focuscurrentorlast

# Groups: SUPER+G makes a group (or dissolves it), CTRL+Tab cycles tabs,
# SUPER+CTRL+SHIFT+H/J/K/L moves the window into the neighbour's group,
# SUPER+SHIFT+G takes it out again.
bind = $mod, G, togglegroup
bind = $mod SHIFT, G, moveoutofgroup
bind = CTRL, Tab, changegroupactive, f
bind = CTRL SHIFT, Tab, changegroupactive, b
bind = $mod CTRL SHIFT, H, moveintogroup, l
bind = $mod CTRL SHIFT, J, moveintogroup, d
bind = $mod CTRL SHIFT, K, moveintogroup, u
bind = $mod CTRL SHIFT, L, moveintogroup, r

# Web: new browser tile, address bar, back/forward/reload, Web Inspector.
bind = $mod, B, web,
bind = $mod, O, webnav, focusurl

# iOS Simulator: show a booted simulator in a tile (a menu if several are booted).
# Click/drag = touch, typing goes to the device. Cmd+Esc = Home, Cmd+Shift+Esc = Lock.
bind = $mod, I, sim,
bind = $mod, escape, simbutton, home
bind = $mod SHIFT, escape, simbutton, lock
bind = $mod ALT, left, webnav, back
bind = $mod ALT, right, webnav, forward
bind = $mod ALT, R, webnav, reload
bind = $mod ALT, I, webnav, inspect

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

bind = $mod ALT, H, swapwindow, l
bind = $mod ALT, J, swapwindow, d
bind = $mod ALT, K, swapwindow, u
bind = $mod ALT, L, swapwindow, r

binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, L, resizeactive, 40 0
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, J, resizeactive, 0 40

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, bracketleft, workspace, e-1
bind = $mod, bracketright, workspace, e+1

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Pickers: go to a workspace, move the window to one (a number, a name, or a new
# name), and name the current one. Names show in the bar next to the number.
bind = $mod, P, picker, workspace
bind = $mod SHIFT, P, picker, movetoworkspace
bind = $mod, N, picker, renameworkspace
# Layouts: workspace templates in ~/.config/hyprmux/layouts/. ⌘U opens one (or goes to
# it if it's open); ⇧⌘U saves the current workspace as one.
bind = $mod, U, picker, layout
bind = $mod SHIFT, U, picker, savelayout
# Names can also come from workspace rules:
# workspace = 1, defaultName:main

# Drag floating windows with mod + left mouse, resize with mod + right mouse.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize mode: mod+R, then h/j/k/l, Escape to leave.
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -30 0
binde = , L, resizeactive, 30 0
binde = , K, resizeactive, 0 -30
binde = , J, resizeactive, 0 30
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset
