# Config for demo recordings (scripts/demo/record.sh): the default config, plus a few
# settings that keep recordings clean and reproducible.
source = ../../config/hyprmux.conf

input {
    # The real pointer must not move focus mid-recording.
    follow_mouse = 0
}

misc {
    background_color = rgb(11111b)
}

session {
    restore = false
}

web {
    engine = webkit
    address_bar = true
}

hud {
    # Show each shortcut as it's pressed.
    keycast = true
    notifications {
        timeout = 3500
    }
}

ghostty {
    # A plain zsh, not a login shell: no "Last login" line. ZDOTDIR (set by record.sh)
    # points it at scripts/demo/zsh for a neutral prompt.
    command = /bin/zsh
    # zsh/.zshrc sets short titles ("project", or the command) instead of full paths.
    shell-integration-features = no-title
    working-directory = /tmp/hyprmux-demo/project
    font-size = 14
    window-padding-x = 12
    window-padding-y = 10
}
