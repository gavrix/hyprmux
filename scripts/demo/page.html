<!doctype html>
<html><head><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>Hyprmux</title>
<style>
  html,body{margin:0;height:100%;background:#12131a;color:#d6dbe6;font:16px -apple-system,system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  h1{margin:0;font-size:56px;letter-spacing:-1px;background:linear-gradient(90deg,#33ccff,#00ff99);-webkit-background-clip:text;color:transparent}
  p{margin:0;color:#8b93a7}
  .tiles{display:grid;grid-template-columns:repeat(3,120px);gap:10px;margin-top:10px}
  .tiles div{height:72px;border-radius:12px;background:#1b1e29;border:2px solid #2a2f3d}
  .tiles div:first-child{border-color:#33ccff}
</style></head>
<body><main>
  <h1>Hyprmux</h1>
  <p>A web tile, next to your terminals.</p>
  <div class="tiles"><div></div><div></div><div></div></div>
</main></body></html>
